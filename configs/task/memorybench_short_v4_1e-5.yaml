# @package _global_

defaults:
  - override /data: memorybench_short
  - override /model: fastwam
  - _self_

batch_size: 16
num_workers: 8

model:
  mot_checkpoint_mixed_attn: false

lr_scheduler_type: "cosine"
learning_rate: 1e-5
num_epochs: 10
max_steps: 10000
log_every: 10
save_every: 2000
eval_every: 1000

gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: checkpoints/fastwam_release/libero_uncond_2cam224.pt

