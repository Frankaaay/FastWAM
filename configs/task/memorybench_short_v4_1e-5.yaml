# @package _global_

defaults:
  - override /data: memorybench_short
  - override /model: fastwam
  - _self_

batch_size: 24
num_workers: 8

model:
  mot_checkpoint_mixed_attn: false
  enable_mem_stage_v4: true
  redirect_common_files: false

lr_scheduler_type: "cosine"
learning_rate: 1e-5
num_epochs: 10
max_steps: 10000
log_every: 10
# VAE latent cache keeps raw video out of samples, so the current training-time
# eval path is disabled for MemoryBench cache runs. Final checkpoint is still
# saved when max_steps is reached.
save_every: 0
eval_every: 100000

gradient_accumulation_steps: 1
weight_decay: 1e-2
align_optimizer_param_order: true
resume: checkpoints/fastwam_release/libero_uncond_2cam224.pt
allow_action_dim_checkpoint_reinit: true

wandb:
  enabled: true
  workspace: yichx14-uc-irvine
  project: fastwam-mem
  name: memorybench_short_v4_4gpu_1e-5
  group: memorybench-short-v2-comparison
  mode: offline

