# @package _global_

defaults:
  - override /data: fold_cloth_airbot
  - override /model: fastwam
  - _self_

batch_size: 16
num_workers: 8

model:
  redirect_common_files: false
  mot_checkpoint_mixed_attn: false

lr_scheduler_type: cosine
learning_rate: 1e-4
num_epochs: 2
max_steps: null
log_every: 10
save_every: 2500
eval_every: 999999

gradient_accumulation_steps: 1
mixed_precision: bf16
weight_decay: 1e-2
resume: null

wandb:
  enabled: false
  project: fastwam-mem
  name: fold_clothv4_v4_2epoch
  group: fold-cloth-real
