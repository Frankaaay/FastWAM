# @package _global_

defaults:
  - override /data: memorybench_short
  - override /model: fastwam
  - _self_

# Per-GPU batch size. The 4-GPU launcher gives global batch size 96.
batch_size: 24
num_workers: 8

model:
  mot_checkpoint_mixed_attn: false
  enable_mem_stage_v4: false
  redirect_common_files: false

lr_scheduler_type: "cosine"
learning_rate: 1e-5
num_epochs: 10
max_steps: 10000
log_every: 10
save_every: 2000
eval_every: 1000

gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: checkpoints/fastwam_release/libero_uncond_2cam224.pt

wandb:
  enabled: true
  workspace: yichx14-uc-irvine
  project: fastwam-mem
  name: memorybench_short_fastwam_original_4gpu_1e-5
  group: memorybench-short-original-fastwam
  mode: offline
