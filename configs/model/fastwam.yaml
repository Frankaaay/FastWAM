_target_: fastwam.runtime.create_fastwam
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}
redirect_common_files: true
mot_checkpoint_mixed_attn: true
action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
skip_dit_load_from_pretrain: false

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_attention_mask_mode: "first_frame_causal" # default
  action_conditioned: false
  action_dim: ${data.train.processor.action_output_dim}
  action_group_causal_mask_mode: "group_diagonal"

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_action: 1.0

# MEM-style spatio-temporal memory in the Wan VAE.
# When enabled, the conditioning (first-frame) latent is produced by
# `vae.encode_memory([history + current_frame])` so it carries real past frames.
# Requires `data.train.history_video_frames > 0` to actually supply history.
vae_memory:
  enabled: false            # set true to turn on the memory VAE
  warm_start: true          # copy pretrained spatial proj -> temporal_proj after load
  # true  -> train ONLY temporal_proj/gate/pos (DiT + base VAE frozen).
  # false -> ALSO finetune the DiT (+ proprio) so the experts adapt to the
  #          memory-enriched conditioning; base VAE stays frozen. The trainer
  #          honors this at runtime (unfreeze set + optimizer param group).
  train_temporal_only: true
  # Stage-2 middle ground between the two above: keep temporal trainable AND also
  # unfreeze ONLY the DiT input interface (video_expert.patch_embedding, 2 tensors)
  # so the frozen DiT re-learns to read the memory-modified latent. Used together
  # with train_temporal_only=true. No effect unless enabled=true.
  unfreeze_patch_embed: false
