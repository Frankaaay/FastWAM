_target_: fastwam.runtime.create_fastwam
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}
redirect_common_files: true
mot_checkpoint_mixed_attn: true
action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
skip_dit_load_from_pretrain: false

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_attention_mask_mode: "first_frame_causal" # default
  action_conditioned: false
  action_dim: ${data.train.processor.action_output_dim}
  action_group_causal_mask_mode: "group_diagonal"

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_action: 1.0

# MEM-style spatio-temporal memory in the Wan VAE.
# When enabled, the conditioning (first-frame) latent is produced by
# `vae.encode_memory([history + current_frame])` so it carries real past frames.
# Requires `data.train.history_video_frames > 0` to actually supply history.
vae_memory:
  enabled: false            # set true to turn on the memory VAE
  # DiT-side short-term memory (option C / 6.1, MEM-stage2). MUTUALLY EXCLUSIVE
  # with `enabled` above. Instead of the VAE temporal attention, the frozen VAE
  # plain-encodes the history frames and they are PREPENDED to the video token
  # sequence inside the DiT: the current frame absorbs history via the video
  # expert's own self-attention, and the action expert reads the (history-
  # enriched) current-frame K/V. No new params -> loads cleanly from the base
  # ckpt; train the full DiT (set train_temporal_only=false / leave enabled=false
  # so the trainer keeps everything trainable). Needs data.train.history_video_frames>0.
  dit_prepend: false
  # MEM-stage2-v2 fold-current (MUTUALLY EXCLUSIVE with `enabled` and `dit_prepend`).
  # The frozen VAE plain-encodes the history frames; the video expert's
  # TemporalFoldAdapter folds them into the CURRENT frame's tokens and DROPS the
  # history frames, so the MoT / action expert / masks see the exact base layout
  # (token count, current index, action interface unchanged). The adapter is
  # additive with a zero-init gate -> step-0 output == base, baseline preserved by
  # construction. Only the adapter is trained (whole base DiT/VAE/action frozen).
  # Needs data.train.history_video_frames > 0 (of the form 4n+1, e.g. 5).
  dit_fold_current: false
  # Per-sample probability of dropping the history channel during training so the
  # model also sees "no memory" inputs (keeps mem-off in-distribution). 0 = never.
  fold_history_dropout: 0.4
  # Adapter capacity: max history latent frames (temporal_pos has this many +1 slots).
  fold_max_history_frames: 8
  warm_start: true          # copy pretrained spatial proj -> temporal_proj after load
  # true  -> train ONLY temporal_proj/gate/pos (DiT + base VAE frozen).
  # false -> ALSO finetune the DiT (+ proprio) so the experts adapt to the
  #          memory-enriched conditioning; base VAE stays frozen. The trainer
  #          honors this at runtime (unfreeze set + optimizer param group).
  train_temporal_only: true
  # Stage-2 middle ground between the two above: keep temporal trainable AND also
  # unfreeze ONLY the DiT input interface (video_expert.patch_embedding, 2 tensors)
  # so the frozen DiT re-learns to read the memory-modified latent. Used together
  # with train_temporal_only=true. No effect unless enabled=true.
  unfreeze_patch_embed: false
