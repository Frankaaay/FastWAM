# @package _global_

defaults:
  - _self_
  - data: null
  - model: null
  - task: null


output_dir: ./runs/train/${now:%Y-%m-%d}_${now:%H-%M-%S}

# dataloading
batch_size: 2
num_workers: 4

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1.0e-4
# 将 numel 非 16B 对齐倍数的参数移到 DeepSpeed flatten 尾部，避免 bf16 GEMM 退化到慢 7-8 倍的
# cutlass_75 align1 kernel（详见 docs/26-07-03/26-07-03-gemm-alignment-fix.md）。
# 只改变 optimizer 参数在 flat buffer 中的顺序，不改变训练数学；但会改变 optimizer state 布局，
# 因此不能用它 resume 旧顺序（false）训练产生的 checkpoint。全新训练默认开启。
align_optimizer_param_order: true
num_epochs: 1
max_steps: null
log_every: 10
save_every: 100
eval_every: 50
eval_num_inference_steps: 10

# training
gradient_accumulation_steps: 1
mixed_precision: "bf16" # one of: [no, fp16, bf16]
seed: 42
max_grad_norm: 1.0
weight_decay: 0.0
resume: null

# profiling
profile:
  timing_enabled: false
  timing_log_every: null
  timing_sync_cuda: true
  torch_enabled: false
  trace_dir: null
  wait_steps: 2
  warmup_steps: 2
  active_steps: 5
  repeat: 1
  rank0_only: true
  record_shapes: false
  profile_memory: false
  with_stack: false
  with_flops: false

# wandb
wandb:
  enabled: false
  workspace: null
  project: fast-wam
  name: train
  group: null
  mode: online

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
