<?xml version="1.0" encoding="UTF-8"?>
<svg width="2200" height="1320" viewBox="0 0 2200 1320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4472c4"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#70ad47"/>
    </marker>
    <marker id="arrowGray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7f7f7f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="2200" height="1320" fill="#ffffff"/>

  <!-- ======================= Title ======================= -->
  <text x="70" y="88" font-size="42" font-weight="bold" fill="#1f3864">v4 · Spatial-Temporal Memory — History Prepend as KV Cache</text>
  <text x="70" y="128" font-size="21" fill="#595959">在 WAM 输入序列前 prepend 视频 / 动作历史：历史只提供 Key/Value、不产生 Query，整个去噪过程复用同一份缓存</text>

  <!-- ======================= Row A: inputs ======================= -->
  <rect x="70" y="170" width="380" height="110" rx="12" fill="#dce6f5" stroke="#4472c4" stroke-width="2.5"/>
  <text x="260" y="207" font-size="22" font-weight="bold" fill="#1f3864" text-anchor="middle">History + current frames</text>
  <text x="260" y="236" font-size="17" fill="#404040" text-anchor="middle">过去 16 步窗口采样 + 当前帧</text>
  <text x="260" y="261" font-size="16" fill="#595959" text-anchor="middle">V[t−16 … t]（clean）</text>

  <rect x="490" y="170" width="380" height="110" rx="12" fill="#dce6f5" stroke="#4472c4" stroke-width="2.5"/>
  <text x="680" y="207" font-size="22" font-weight="bold" fill="#1f3864" text-anchor="middle">History actions</text>
  <text x="680" y="236" font-size="17" fill="#404040" text-anchor="middle">过去 20 步已执行动作</text>
  <text x="680" y="261" font-size="16" fill="#595959" text-anchor="middle">a[t−20 … t−1]（clean）</text>

  <rect x="910" y="170" width="420" height="110" rx="12" fill="#f7f7f7" stroke="#7f7f7f" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1120" y="207" font-size="22" font-weight="bold" fill="#404040" text-anchor="middle">Noise init — 被去噪对象</text>
  <text x="1120" y="236" font-size="17" fill="#404040" text-anchor="middle">未来视频 latent ＋ 未来动作 chunk ×32</text>
  <text x="1120" y="261" font-size="16" fill="#595959" text-anchor="middle">V̂[t+4 … t+32]、â[t … t+31]</text>

  <!-- ======================= Row B: encoders ======================= -->
  <rect x="110" y="330" width="300" height="72" rx="10" fill="#eef3fb" stroke="#4472c4" stroke-width="2"/>
  <text x="260" y="358" font-size="19" font-weight="bold" fill="#1f3864" text-anchor="middle">Wan2.2 VAE Encoder</text>
  <text x="260" y="384" font-size="15" fill="#595959" text-anchor="middle">unchanged → clean latent 帧（末帧＝当前）</text>

  <rect x="530" y="330" width="300" height="72" rx="10" fill="#eef3fb" stroke="#4472c4" stroke-width="2"/>
  <text x="680" y="358" font-size="19" font-weight="bold" fill="#1f3864" text-anchor="middle">Action tokenizer</text>
  <text x="680" y="384" font-size="15" fill="#595959" text-anchor="middle">＋ source-type &amp; timeline 位置编码</text>

  <!-- arrows: inputs -> encoders -> strip -->
  <line x1="260" y1="280" x2="260" y2="324" stroke="#4472c4" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="260" y1="402" x2="260" y2="458" stroke="#4472c4" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="680" y1="280" x2="680" y2="324" stroke="#4472c4" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="680" y1="402" x2="680" y2="458" stroke="#4472c4" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="1120" y1="280" x2="1120" y2="434" stroke="#7f7f7f" stroke-width="3" marker-end="url(#arrowGray)"/>

  <!-- ======================= Brackets over token strip ======================= -->
  <text x="400" y="430" font-size="17" font-weight="bold" fill="#2f5597" text-anchor="middle">Clean history prefix ── 只提供 K / V（prefill 1 次 / 控制步）</text>
  <path d="M110,456 L110,444 L760,444 L760,456" fill="none" stroke="#2f5597" stroke-width="2.5"/>
  <rect x="694" y="416" width="56" height="25" rx="4" fill="#2f5597"/>
  <text x="722" y="434" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">NEW</text>

  <text x="1020" y="430" font-size="17" font-weight="bold" fill="#c55a11" text-anchor="middle">Future tokens ── 产生 Q 并被去噪</text>
  <path d="M800,456 L800,444 L1240,444 L1240,456" fill="none" stroke="#c55a11" stroke-width="2.5"/>

  <!-- ======================= Token strip ======================= -->
  <!-- history video latents -->
  <rect x="110" y="470" width="50" height="50" rx="6" fill="#b8cce4" stroke="#4472c4" stroke-width="2"/>
  <rect x="166" y="470" width="50" height="50" rx="6" fill="#b8cce4" stroke="#4472c4" stroke-width="2"/>
  <rect x="222" y="470" width="50" height="50" rx="6" fill="#b8cce4" stroke="#4472c4" stroke-width="2"/>
  <rect x="278" y="470" width="50" height="50" rx="6" fill="#b8cce4" stroke="#4472c4" stroke-width="2"/>
  <text x="135" y="502" font-size="20" fill="#1f3864" text-anchor="middle">h</text>
  <text x="191" y="502" font-size="20" fill="#1f3864" text-anchor="middle">h</text>
  <text x="247" y="502" font-size="20" fill="#1f3864" text-anchor="middle">h</text>
  <text x="303" y="502" font-size="20" fill="#1f3864" text-anchor="middle">h</text>
  <!-- current frame latent -->
  <rect x="334" y="470" width="50" height="50" rx="6" fill="#2f5597" stroke="#1f3864" stroke-width="2"/>
  <text x="359" y="502" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">c</text>
  <text x="247" y="544" font-size="14" fill="#4472c4" text-anchor="middle">history video latents ＋ current（clean）</text>

  <!-- history actions -->
  <rect x="470" y="470" width="50" height="50" rx="6" fill="#c6e0b4" stroke="#70ad47" stroke-width="2"/>
  <rect x="526" y="470" width="50" height="50" rx="6" fill="#c6e0b4" stroke="#70ad47" stroke-width="2"/>
  <rect x="582" y="470" width="50" height="50" rx="6" fill="#c6e0b4" stroke="#70ad47" stroke-width="2"/>
  <text x="495" y="502" font-size="20" fill="#375623" text-anchor="middle">a</text>
  <text x="551" y="502" font-size="20" fill="#375623" text-anchor="middle">a</text>
  <text x="607" y="502" font-size="20" fill="#375623" text-anchor="middle">a</text>
  <text x="662" y="504" font-size="24" fill="#70ad47" text-anchor="middle">⋯</text>
  <text x="570" y="544" font-size="14" fill="#548235" text-anchor="middle">history actions ×20（clean）</text>

  <!-- KV boundary -->
  <text x="770" y="410" font-size="13" fill="#7f7f7f" text-anchor="middle">KV 边界</text>
  <line x1="770" y1="418" x2="770" y2="556" stroke="#7f7f7f" stroke-width="2.5" stroke-dasharray="8 5"/>

  <!-- future actions -->
  <rect x="800" y="470" width="50" height="50" rx="6" fill="#fde9d9" stroke="#ed7d31" stroke-width="2"/>
  <rect x="856" y="470" width="50" height="50" rx="6" fill="#fde9d9" stroke="#ed7d31" stroke-width="2"/>
  <rect x="912" y="470" width="50" height="50" rx="6" fill="#fde9d9" stroke="#ed7d31" stroke-width="2"/>
  <text x="825" y="502" font-size="20" fill="#843c0c" text-anchor="middle">â</text>
  <text x="881" y="502" font-size="20" fill="#843c0c" text-anchor="middle">â</text>
  <text x="937" y="502" font-size="20" fill="#843c0c" text-anchor="middle">â</text>
  <text x="988" y="504" font-size="24" fill="#ed7d31" text-anchor="middle">⋯</text>
  <text x="895" y="544" font-size="14" fill="#c55a11" text-anchor="middle">future actions ×32（noisy）</text>

  <!-- future video latents -->
  <rect x="1030" y="470" width="50" height="50" rx="6" fill="#e6dcf0" stroke="#8064a2" stroke-width="2"/>
  <rect x="1086" y="470" width="50" height="50" rx="6" fill="#e6dcf0" stroke="#8064a2" stroke-width="2"/>
  <rect x="1142" y="470" width="50" height="50" rx="6" fill="#e6dcf0" stroke="#8064a2" stroke-width="2"/>
  <text x="1055" y="502" font-size="20" fill="#3f2a56" text-anchor="middle">v̂</text>
  <text x="1111" y="502" font-size="20" fill="#3f2a56" text-anchor="middle">v̂</text>
  <text x="1167" y="502" font-size="20" fill="#3f2a56" text-anchor="middle">v̂</text>
  <text x="1218" y="504" font-size="24" fill="#8064a2" text-anchor="middle">⋯</text>
  <text x="1120" y="544" font-size="14" fill="#8064a2" text-anchor="middle">future video latents（noisy）</text>

  <!-- timeline axis -->
  <line x1="110" y1="572" x2="1250" y2="572" stroke="#bfbfbf" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="1272" y="577" font-size="14" fill="#7f7f7f">time</text>
  <text x="247" y="596" font-size="13" fill="#7f7f7f" text-anchor="middle">t−16 … t</text>
  <text x="570" y="596" font-size="13" fill="#7f7f7f" text-anchor="middle">t−20 … t−1</text>
  <text x="895" y="596" font-size="13" fill="#7f7f7f" text-anchor="middle">t … t+31</text>
  <text x="1120" y="596" font-size="13" fill="#7f7f7f" text-anchor="middle">t+4 … t+32</text>

  <!-- arrows: strip -> DiT -->
  <line x1="420" y1="604" x2="420" y2="662" stroke="#4472c4" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="985" y1="604" x2="985" y2="662" stroke="#c55a11" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <!-- ======================= DiT box ======================= -->
  <rect x="70" y="670" width="1360" height="330" rx="14" fill="#f2f2f2" stroke="#7f7f7f" stroke-width="2"/>
  <text x="750" y="708" font-size="24" font-weight="bold" fill="#333333" text-anchor="middle">FastWAM MoT DiT ── video expert ‖ action expert（结构与权重形式不变）</text>

  <!-- panel 1: prefill -->
  <rect x="100" y="730" width="620" height="230" rx="10" fill="#ffffff" stroke="#4472c4" stroke-width="2"/>
  <rect x="640" y="742" width="58" height="26" rx="4" fill="#2f5597"/>
  <text x="669" y="761" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">NEW</text>
  <text x="124" y="766" font-size="20" font-weight="bold" fill="#1f3864">① Prefill ── 每个控制步只做 1 次</text>
  <text x="124" y="800" font-size="16" fill="#404040">· history video（clean，t=0）全层前向，前缀内部双向可见</text>
  <text x="124" y="830" font-size="16" fill="#404040">· history action（clean，t=0）经 action expert 前向</text>
  <text x="124" y="860" font-size="16" fill="#404040">· 每一层的 K、V 拼接缓存 → condition KV cache</text>
  <text x="124" y="890" font-size="16" fill="#404040">· 不去噪、不计 loss ── 纯条件，不产生输出</text>

  <!-- panel 2: denoise -->
  <rect x="760" y="730" width="630" height="230" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2"/>
  <text x="784" y="766" font-size="20" font-weight="bold" fill="#843c0c">② Denoise ── ×N 去噪步（flow matching）</text>
  <text x="784" y="800" font-size="16" fill="#404040">· future video / action token 计算 Q·K·V 并被更新</text>
  <text x="784" y="830" font-size="16" fill="#404040">· attention keys ＝ [ 缓存的 history K/V ‖ future 自身 K/V ]</text>
  <text x="784" y="860" font-size="16" fill="#404040">· history 不参与 Q：不被重算、不被去噪</text>
  <text x="784" y="890" font-size="16" fill="#404040">· N 个去噪步共享同一份 cache → 记忆开销被摊销</text>

  <!-- arrow between panels (drawn last so the label stays on top of both panels) -->
  <line x1="722" y1="845" x2="756" y2="845" stroke="#4472c4" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <rect x="694" y="808" width="90" height="24" rx="4" fill="#eef3fb" stroke="#4472c4" stroke-width="1"/>
  <text x="739" y="825" font-size="14" fill="#1f3864" text-anchor="middle">逐层 K/V</text>

  <!-- ======================= Outputs ======================= -->
  <line x1="1430" y1="765" x2="1494" y2="765" stroke="#70ad47" stroke-width="3.5" marker-end="url(#arrowGreen)"/>
  <line x1="1430" y1="915" x2="1494" y2="915" stroke="#70ad47" stroke-width="3.5" marker-end="url(#arrowGreen)"/>

  <rect x="1500" y="710" width="340" height="110" rx="12" fill="#e2efda" stroke="#70ad47" stroke-width="2.5"/>
  <text x="1670" y="753" font-size="21" font-weight="bold" fill="#375623" text-anchor="middle">Future frames</text>
  <text x="1670" y="783" font-size="16" fill="#404040" text-anchor="middle">未来视频 latent（world-model 监督）</text>

  <rect x="1500" y="860" width="340" height="110" rx="12" fill="#e2efda" stroke="#70ad47" stroke-width="2.5"/>
  <text x="1670" y="903" font-size="21" font-weight="bold" fill="#375623" text-anchor="middle">Action chunk</text>
  <text x="1670" y="933" font-size="16" fill="#404040" text-anchor="middle">未来 32 步动作（部署时执行）</text>

  <!-- ======================= Right panel: attention detail ======================= -->
  <rect x="1400" y="170" width="730" height="430" rx="14" fill="#fbfcfe" stroke="#4472c4" stroke-width="2"/>
  <text x="1430" y="212" font-size="22" font-weight="bold" fill="#1f3864">Inside the Attention ── history 只当 K/V</text>

  <text x="1765" y="268" font-size="15" font-weight="bold" fill="#595959" text-anchor="middle">K/V：history</text>
  <text x="1990" y="268" font-size="15" font-weight="bold" fill="#595959" text-anchor="middle">K/V：future</text>

  <text x="1430" y="330" font-size="15" font-weight="bold" fill="#595959">Q：history</text>
  <text x="1430" y="352" font-size="13.5" fill="#7f7f7f">（仅 prefill 阶段）</text>
  <text x="1430" y="455" font-size="15" font-weight="bold" fill="#595959">Q：future</text>
  <text x="1430" y="477" font-size="13.5" fill="#7f7f7f">（每个去噪步）</text>

  <rect x="1660" y="280" width="210" height="110" rx="8" fill="#dce6f5" stroke="#4472c4" stroke-width="1.5"/>
  <text x="1765" y="330" font-size="26" fill="#1f3864" text-anchor="middle">✓</text>
  <text x="1765" y="362" font-size="13" fill="#404040" text-anchor="middle">前缀内部互看</text>

  <rect x="1885" y="280" width="210" height="110" rx="8" fill="#f2f2f2" stroke="#bfbfbf" stroke-width="1.5"/>
  <text x="1990" y="330" font-size="26" fill="#7f7f7f" text-anchor="middle">✗</text>
  <text x="1990" y="362" font-size="13" fill="#7f7f7f" text-anchor="middle">永远看不到未来</text>

  <rect x="1660" y="405" width="210" height="110" rx="8" fill="#2f5597" stroke="#1f3864" stroke-width="1.5"/>
  <text x="1765" y="452" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">✓ 读记忆</text>
  <text x="1765" y="484" font-size="13" fill="#dce6f5" text-anchor="middle">拼接缓存的 K/V，无需重算</text>

  <rect x="1885" y="405" width="210" height="110" rx="8" fill="#ffffff" stroke="#ed7d31" stroke-width="1.5"/>
  <text x="1990" y="452" font-size="26" fill="#843c0c" text-anchor="middle">✓</text>
  <text x="1990" y="484" font-size="13" fill="#404040" text-anchor="middle">正常自注意力</text>

  <text x="1430" y="552" font-size="13.5" fill="#595959">分支细节：future video 读 history video（前缀因果）；</text>
  <text x="1430" y="576" font-size="13.5" fill="#595959">future action 读 history video ＋ history action ＋ 自身。</text>

  <!-- ======================= Bottom note ======================= -->
  <rect x="70" y="1050" width="2060" height="210" rx="14" fill="#ffffff" stroke="#4472c4" stroke-width="3"/>
  <text x="100" y="1092" font-size="22" font-weight="bold" fill="#1f3864">核心改动：不动 VAE、不动 DiT 结构 ── 记忆只发生在「输入序列 ＋ 注意力」层面</text>
  <text x="100" y="1130" font-size="17" fill="#404040">· 在 WAM 序列前 prepend 时空记忆：历史视频 latent（VAE 正常编码，16 步窗口 → 2 个 latent 帧）＋ 历史动作 ×20，配共享 timeline 位置编码（current＝20）与 5 类 source-type embedding</text>
  <text x="100" y="1162" font-size="17" fill="#404040">· history token 每个控制步只前向 1 次、逐层缓存 K/V；去噪时把缓存拼进注意力 ── history 不产生 Q、不被去噪、不计 loss，N 个去噪步复用同一份 cache</text>
  <text x="100" y="1194" font-size="17" fill="#404040">· 训练时历史视频 / 历史动作各以 20% 概率独立 dropout，保留无记忆回退与 CFG 空间；history 为空时严格退化为原 FastWAM</text>

  <!-- ======================= Legend ======================= -->
  <rect x="100" y="1282" width="20" height="20" rx="4" fill="#b8cce4" stroke="#4472c4" stroke-width="1.5"/>
  <text x="128" y="1298" font-size="14" fill="#595959">h 历史视频 latent</text>
  <rect x="290" y="1282" width="20" height="20" rx="4" fill="#2f5597"/>
  <text x="318" y="1298" font-size="14" fill="#595959">c 当前帧</text>
  <rect x="430" y="1282" width="20" height="20" rx="4" fill="#c6e0b4" stroke="#70ad47" stroke-width="1.5"/>
  <text x="458" y="1298" font-size="14" fill="#595959">a 历史动作</text>
  <rect x="590" y="1282" width="20" height="20" rx="4" fill="#fde9d9" stroke="#ed7d31" stroke-width="1.5"/>
  <text x="618" y="1298" font-size="14" fill="#595959">â 未来动作（noisy）</text>
  <rect x="810" y="1282" width="20" height="20" rx="4" fill="#e6dcf0" stroke="#8064a2" stroke-width="1.5"/>
  <text x="838" y="1298" font-size="14" fill="#595959">v̂ 未来视频 latent（noisy）</text>
  <text x="2130" y="1298" font-size="14" fill="#a6a6a6" text-anchor="end">FastWAM · mem-stage-v4</text>
</svg>
